name = "tavelle-api"
main = "src/index.ts"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]

# Local + default bindings. Create remote resources once (see README):
#   wrangler d1 create tavelle
#   wrangler r2 bucket create tavelle-files
# Placeholders below work for `wrangler dev` / local D1; replace IDs before remote deploy.

[[d1_databases]]
binding = "DB"
database_name = "tavelle"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../packages/db/migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "tavelle-files"
preview_bucket_name = "tavelle-files-preview"

[vars]
ENVIRONMENT = "development"

# --- staging (workers.dev) ---
# One Worker serves /api/* and SPA assets (same-origin cookies).
# Build web first: `pnpm --filter @tavelle/web build`
[env.staging]
name = "tavelle-api-staging"
vars = { ENVIRONMENT = "staging" }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "tavelle-staging"
database_id = "5b35d4cb-80dc-40a7-ac67-a37122a653b9"
migrations_dir = "../../packages/db/migrations"

[[env.staging.r2_buckets]]
binding = "FILES"
bucket_name = "tavelle-files-staging"

[env.staging.assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
